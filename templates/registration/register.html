{% extends "registration/login_base.html" %}

{% block content %}

<style>

.auth-container{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

    background:#343541;
}

.auth-card{

    width:450px;

    background:#202123;

    border:1px solid #3d3d3d;

    border-radius:18px;

    padding:40px;

    box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.auth-logo{

    text-align:center;

    font-size:55px;

    margin-bottom:10px;
}

.auth-title{

    text-align:center;

    font-size:30px;

    font-weight:700;

    margin-bottom:8px;
}

.auth-subtitle{

    text-align:center;

    color:#9ca3af;

    margin-bottom:30px;

    font-size:15px;
}

.form-group{

    margin-bottom:18px;
}

.form-group label{

    display:block;

    margin-bottom:8px;

    color:#d1d5db;

    font-size:14px;

    font-weight:600;
}

.form-control{

    width:100%;

    padding:14px 16px;

    border:1px solid #444;

    border-radius:10px;

    background:#40414f;

    color:white;

    font-size:15px;

    outline:none;

    transition:.2s;
}

.form-control:focus{

    border-color:#19c37d;

    box-shadow:0 0 0 3px rgba(25,195,125,.25);
}

.auth-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#19c37d;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

    margin-top:10px;
}

.auth-btn:hover{

    background:#15a86b;
}

.auth-footer{

    margin-top:25px;

    text-align:center;

    color:#c5c5c5;
}

.auth-footer a{

    color:#19c37d;

    text-decoration:none;

    font-weight:600;
}

.auth-footer a:hover{

    text-decoration:underline;
}

.error-box{

    background:#ff4d4f;

    color:white;

    padding:12px;

    border-radius:8px;

    margin-bottom:20px;

    text-align:center;
}

</style>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🤖
        </div>

        
        <div class="auth-subtitle">
            Join Cognivra AI Assistant
            <p style="text-align: center; margin: 0; font-size: 14px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: #16a46a;">Knowledge. Context. Intelligence.</p>
        </div>
        
        <div class="auth-title">
            Create Account
        </div>
        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm password"
                    required>

            </div>

            <button type="submit" class="auth-btn">

                Create Account

            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">

                Login

            </a>

        </div>

    </div>

</div>

{% endblock %}
