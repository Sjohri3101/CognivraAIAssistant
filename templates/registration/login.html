{% extends "registration/login_base.html" %}

{% block content %}

<style>
    .auth-wrapper {

        flex: 1;

        display: flex;

        justify-content: center;

        align-items: center;

        background: #343541;
    }

    .auth-card {

        width: 420px;

        background: #202123;

        padding: 40px;

        border-radius: 15px;

        box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
    }

    .auth-card h2{

        text-align: center;

        margin-bottom: 30px;
    }

    .form-group {

        margin-bottom: 18px;
    }

    .form-group label {

        display: block;

        margin-bottom: 8px;

        color: #ddd;
    }

    .form-control {

        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background: #40414f;

        color: #fff;

        font-size: 15px;
    }

    .auth-btn {

        width: 100%;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #19c37d;

        color: #fff;

        cursor: pointer;

        font-size: 16px;

        margin-top: 10px;
    }

    .auth-btn:hover {

        background: #16a46a;
    }

    .auth-footer {

        text-align: center;

        margin-top: 20px;

        color: #bbb;
    }

    .auth-footer a {

        color: #19c37d;
    }

    .error {

        background: #ff4d4f;

        padding: 10px;

        border-radius: 6px;

        margin-bottom: 15px;

        text-align: center;
    }
</style>

<div class="auth-wrapper">

    <div class="auth-card">

        <h2>🤖 Cognivra AI Assistant 🤖
            <p style="text-align: center; margin: 0; font-size: 14px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; color: #16a46a;">Knowledge. Context. Intelligence.</p>
        </h2>
        

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input type="text" name="username" class="form-control" required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input type="password" name="password" class="form-control" required>

            </div>

            <button class="auth-btn">

                Login

            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">

                Register

            </a>

        </div>

    </div>

</div>

{% endblock %}
